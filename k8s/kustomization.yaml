apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply everything with `kubectl apply -k k8s/`, or edit the image tag here and
# roll it with `kubectl apply -k k8s/ && kubectl rollout status deploy/portfolio`.
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: portfolio

images:
  - name: ghcr.io/vishnukumarkvs/portfolio
    newTag: latest
