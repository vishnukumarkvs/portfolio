# GoReleaser builds a release archive per platform from a tag and publishes it
# as a GitHub Release. Run through .github/workflows/release.yml, not by hand.
#
#   goreleaser check                 validate this file
#   goreleaser release --snapshot    build everything, publish nothing
#
# The binary is the only artefact that matters. The site is embedded in it, so
# an archive is just the server plus the checksums beside it: nothing to
# install, and no runtime dependency to document.
version: 2

project_name: portfolio

before:
  hooks:
    - go mod tidy
    - go mod verify

# One plain Go binary. CGO off makes the result static and reproducible, and
# drops libc version differences from the equation entirely.
builds:
  - id: portfolio
    main: .
    binary: portfolio
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      # Embed the commit, tag and dirty state via Go's own build info, so a
      # binary can be traced to its source without adding a -version flag.
      - -buildvcs=true
    ldflags:
      - -s -w
    # Same tag in, same bytes out.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: portfolio
    ids:
      - portfolio
    # zip on Windows, tar.gz everywhere else.
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      # Uncomment once a LICENSE file exists. It is left out rather than
      # guessed at; see the Licence section of the README.
      # - LICENSE

checksum:
  name_template: "checksums.txt"

# Container image for the Kubernetes manifests. GoReleaser has already built and
# cross-compiled the linux binaries by this point, so the image build only wraps
# one of them; Dockerfile.goreleaser copies it in rather than recompiling.
#
# Both architectures go into a single multi-arch manifest, so a node of either
# kind pulls `:latest` and gets the right one without the manifest caring.
dockers_v2:
  - id: portfolio
    ids:
      - portfolio
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    # dockers_v2 splits these in two: `images` is the untagged repository,
    # `tags` are the tag names applied to it.
    images:
      # ghcr requires an explicit owner and a lowercase repository path.
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/portfolio"
    tags:
      - "{{ .Version }}"
      # A prerelease must never claim the floating tag, or `latest` would point
      # at an rc that k8s could pull by accident.
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: portfolio
      org.opencontainers.image.description: Static site server, single binary.
      org.opencontainers.image.source: "https://github.com/{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

# One release per tag, published immediately and marked as the latest.
release:
  prerelease: auto
  mode: replace
  header: |
    Static site server, single binary, no runtime dependencies.

    Unpack, run it, and the site is on the port. `ADDR` and `PORT` are the only
    settings; there are no flags and no config file.
  footer: |
    The site is embedded in the binary, so every platform archive is a
    complete, self-contained copy. To serve your own copy of the site, see
    <https://github.com/vishnukumarkvs/portfolio>.
  name_template: "{{ .ProjectName }} {{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
      - "^\\W*$"
