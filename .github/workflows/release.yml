# Publishes a GitHub Release when a v* tag is pushed. GoReleaser builds the
# binaries for every platform in .goreleaser.yaml, attaches the archives and
# checksums, and writes the release notes.
#
# To make a release:
#   git tag -a v1.0.0 -m "first release"
#   git push origin v1.0.0
#
# The tag is what triggers this. Do not move a published tag: the release is
# already attached to it, and force-pushing a tag leaves the two out of step.
name: Release

on:
  push:
    tags:
      - 'v*'

# contents: write to create the release, packages: write to push the image to
# ghcr. Nothing else is granted.
permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and full history: GoReleaser reads the tag to name the release
          # and the commit range to build the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # dockers_v2 drives docker buildx, and buildx cannot assemble a
      # multi-platform manifest without a builder that supports one. The default
      # builder on a GitHub runner only does the host platform.
      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      # Logs in to ghcr with the same automatic token. The password is the
      # token, the username is the repository owner.
      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and publish
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          args: release --clean
        env:
          # The automatic token for this repository. No PAT or secret to
          # configure, and it is scoped to this one job.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
